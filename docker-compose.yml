services:
  web:
    build:
      context: .
      target: dev
    container_name: forest-without-ticks-dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - CHOKIDAR_USEPOLLING=true
    restart: unless-stopped

  web-prod:
    build:
      context: .
      target: prod
    container_name: forest-without-ticks-prod
    ports:
      - "3000:3000"
    env_file:
      - .env
    profiles:
      - prod
    restart: unless-stopped
