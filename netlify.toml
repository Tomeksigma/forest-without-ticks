# Netlify Configuration for TanStack Start + Nitro
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  AWS_LAMBDA_JS_RUNTIME = "nodejs22.x"
  NITRO_PRESET = "netlify"
  SUPABASE_URL = "https://adyhoqvmkrinjsyczmuc.supabase.co"
  SUPABASE_PROJECT_ID = "adyhoqvmkrinjsyczmuc"
  VITE_SUPABASE_URL = "https://adyhoqvmkrinjsyczmuc.supabase.co"
  VITE_SUPABASE_PROJECT_ID = "adyhoqvmkrinjsyczmuc"

# Proxy Lovable Assets (e.g. videos and external assets) to Lovable CDN
[[redirects]]
  from = "/__l5e/assets-v1/*"
  to = "https://5471dd47-db5b-5dc1-8fce-ce5dc895cd5a.lovableproject.com/__l5e/assets-v1/:splat"
  status = 200
  force = false

# Redirect all requests to Nitro's server handler on Netlify
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
  force = false
